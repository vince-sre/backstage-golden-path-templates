# Generated by the python-service golden path. The heavy lifting (build,
# Trivy, SBOM, cosign, GitOps promotion) lives in shared reusable workflows,
# so fixes to the pipeline reach every service without touching this file.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  image:
    needs: test
    uses: vince-sre/cicd-pipeline-templates/.github/workflows/reusable-container-build.yml@v1
    with:
      image-name: ${{ values.image }}
      push: {% raw %}${{ github.event_name == 'push' }}{% endraw %}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  deploy-dev:
    if: github.event_name == 'push'
    needs: image
    uses: vince-sre/cicd-pipeline-templates/.github/workflows/reusable-gitops-promote.yml@v1
    with:
      gitops-repo: ${{ values.gitopsRepo }}
      values-file: workloads/${{ values.name }}/values-dev.yaml
      tag: {% raw %}${{ needs.image.outputs.tag }}{% endraw %}
      auto-merge: true
    secrets:
      GITOPS_TOKEN: {% raw %}${{ secrets.GITOPS_TOKEN }}{% endraw %}
