name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  ACTIONLINT_VERSION: 1.7.3
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint this repo's workflows
        run: actionlint

      - name: Validate templates
        run: ./scripts/validate.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init fetches plugins from GitHub
